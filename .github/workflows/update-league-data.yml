name: Update Sleeper league data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/update-league-data.yml'
  schedule:
    # Run both possible UTC offsets for 07:30 Europe/Berlin.
    # The guard below handles DST and delayed GitHub scheduler starts.
    - cron: '30 5 * * *'
    - cron: '30 6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether to refresh
        id: refresh
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          today="$(TZ=Europe/Berlin date +%F)"
          local_hm="$(TZ=Europe/Berlin date +%H%M)"
          generated_at="$(jq -r '.generatedAt // empty' data/league-state.json)"
          generated_date=""

          if [[ -n "$generated_at" ]]; then
            generated_date="$(TZ=Europe/Berlin date -d "$generated_at" +%F 2>/dev/null || true)"
          fi

          if [[ "$generated_date" == "$today" ]]; then
            echo "Sleeper data was already refreshed today ($generated_date)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$local_hm" < "0730" ]]; then
            echo "Too early in Europe/Berlin ($local_hm); waiting for the later DST-safe cron."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Sleeper data is stale for today; refreshing now."
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.refresh.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Sleeper data
        if: steps.refresh.outputs.run == 'true'
        env:
          SLEEPER_LEAGUE_ID: '1400190366010863616'
          SLEEPER_USERNAME: 'nibra180'
        run: npm run fetch

      - name: Commit updated data
        if: steps.refresh.outputs.run == 'true'
        shell: bash
        run: |
          git add data/league-state.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Sleeper league data"
          git pull --rebase origin main
          git push origin HEAD:main
