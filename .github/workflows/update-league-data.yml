name: Update Sleeper league data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/update-league-data.yml'
      - '.github/sleeper-refresh-trigger.txt'
  schedule:
    # Run once every morning at 05:07 German local time.
    # GitHub supports IANA time zones here, so DST is handled automatically.
    # Using :07 instead of :00 reduces the risk of scheduler delays at the top of the hour.
    - cron: '7 5 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: write

concurrency:
  group: update-sleeper-league-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Sleeper data
        env:
          SLEEPER_LEAGUE_ID: '1400190366010863616'
          SLEEPER_USERNAME: 'nibra180'
        run: npm run fetch

      - name: Commit updated data
        shell: bash
        run: |
          git add data/league-state.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Sleeper league data"
          git pull --rebase origin main
          git push origin HEAD:main
